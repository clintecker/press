# The print interior profile: twoside with mirrored margins and a
# gutter, every link printed in black, no cover plate (the cover lives
# on the wrap, not in the interior). open=any is deliberate (and must be
# spelled the KOMA way; the standard-class spelling openany is silently
# ignored under twoside): open=right would ship genuinely blank versos
# and the verifier's no-blank-pages law is worth more than the
# convention.
from: markdown+smart+yaml_metadata_block+fenced_divs+footnotes
standalone: true
toc: true
toc-depth: 1
number-sections: true
top-level-division: chapter
# Syntax highlighting in a single ink (#273). skylighting's default pygments
# style colours a fence tagged yaml/python/sh, and verify_black_ink refuses a
# coloured interior, so the print profile highlights with the house
# monochrome theme: greys and weight/slant only. The reading PDF, HTML and
# EPUB keep the default colours; retinting them is a house-wide design call.
highlight-style: "@press/press-mono.theme"
# Interior figures are redirected to their print-safe copies (flattened,
# resolution-capped) under build/print-assets/, written by press.print_safe
# before this run. The reading PDF has no such filter and embeds the originals.
filters:
  - "@press/lua/typographic-spacing.lua"
  - "@press/lua/set-pieces.lua"
  - "@press/lua/print-safe-images.lua"
  - "@press/lua/chapter-dropcap.lua"
  - "@press/lua/scene-break.lua"
  - "@press/lua/figure-numbering.lua"
pdf-engine: latexmk
pdf-engine-opts:
  - -lualatex
metadata-file: "@book/config/metadata.yaml"
# tex/title-page-print.tex is the print variant of a hand-authored title
# page (typically the reading design minus the colored cover plate); when
# a book supplies it, the reading title-page.tex entry is dropped by the
# build so the two can never stack.
include-in-header:
  - "@press/tex/book-header.tex"
  - "@book/build/profile-geometry.tex?optional"
  - "@book/build/profile-dropcap.tex?optional"
  - "@press/tex/print-header.tex"
  - "@book/build/aesthetic.tex?optional"
  - "@book/build/front-matter.tex?optional"
  - "@book/tex/title-page-print.tex?optional"
  - "@book/tex/title-page.tex?optional"
variables:
  documentclass: scrbook
  classoption:
    - twoside
    - open=any
    - headings=small
  fontsize: 10pt
  colorlinks: true
  linkcolor: black
  urlcolor: black
  citecolor: black
  toc-title: Contents
  lot: false
  thanks: ""
