# The security-control baseline cannot silently regress (#154). The
# source-versioned half (Dependabot, CodeQL, dependency review) is asserted
# with the default token; the platform toggles live behind the admin-only
# security_and_analysis object, so this reads them through SECURITY_AUDIT_TOKEN
# (a fine-grained PAT scoped to this repo, Administration: read) and fails on
# drift. Scheduled and dispatch runs only ever execute on the main repository,
# where that secret is present. Read-only.
name: Security controls

on:
  schedule:
    - cron: "53 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Source-versioned controls are present
        run: |
          set -euo pipefail
          fail=0
          for f in .github/dependabot.yml \
                   .github/workflows/codeql.yml \
                   .github/workflows/dependency-review.yml; do
            [ -f "$f" ] || { echo "drift: missing ${f}"; fail=1; }
          done
          [ "$fail" = 0 ] && echo "source-versioned controls present"
          exit "$fail"

      - name: Platform toggles are enabled
        env:
          GH_TOKEN: ${{ secrets.SECURITY_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "SECURITY_AUDIT_TOKEN is unset; cannot read admin-only settings." \
                 "Provision a fine-grained PAT (Administration: read) as that secret."
            exit 1
          fi
          repo="${{ github.repository }}"
          data=$(gh api "repos/${repo}" --jq '.security_and_analysis')
          fail=0
          # Controls available on any public repo -- these must stay enabled.
          for key in secret_scanning \
                     secret_scanning_push_protection \
                     dependabot_security_updates; do
            status=$(echo "$data" | jq -r ".${key}.status // \"absent\"")
            if [ "$status" != "enabled" ]; then
              echo "drift: ${key} is '${status}', expected 'enabled'"; fail=1
            fi
          done
          # Non-provider patterns and validity checks are Advanced Security
          # sub-features; GHAS is not provisioned on this public repo
          # (advanced_security is null), so GitHub silently no-ops a PATCH that
          # tries to enable them. The honest baseline is that they are off
          # BECAUSE GHAS is unavailable -- a documented limitation (#154,
          # SECURITY.md), not drift. This branch is also the reevaluation
          # trigger the acceptance criterion asks for: if GHAS ever becomes
          # available, an off toggle becomes real drift and fails the run.
          ghas=$(echo "$data" | jq -r '.advanced_security.status // "unavailable"')
          for key in secret_scanning_non_provider_patterns \
                     secret_scanning_validity_checks; do
            status=$(echo "$data" | jq -r ".${key}.status // \"absent\"")
            if [ "$status" = "enabled" ]; then
              echo "${key}: enabled"
            elif [ "$ghas" = "unavailable" ]; then
              echo "${key}: unavailable -- needs Advanced Security (documented limitation)"
            else
              echo "drift: ${key} is '${status}' but Advanced Security is now '${ghas}' -- enable it"; fail=1
            fi
          done
          if gh api "repos/${repo}/vulnerability-alerts" >/dev/null 2>&1; then
            echo "vulnerability-alerts: enabled"
          else
            echo "drift: vulnerability alerts are disabled"; fail=1
          fi
          [ "$fail" = 0 ] && echo "platform security controls at documented baseline"
          exit "$fail"

  # A separate job, so a drift in one control cannot mask a drift in another:
  # a disabled secret-scanning toggle must not hide a removed branch ruleset.
  rulesets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Branch and tag protection rulesets are active (#153)
        env:
          GH_TOKEN: ${{ secrets.SECURITY_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          rulesets=$(gh api "repos/${repo}/rulesets")
          fail=0
          # main cannot be force-pushed or deleted; the three-part release tags
          # (v*.*.*) cannot be moved or deleted -- so the trust graph a pinned
          # book resolves cannot be quietly rewritten under it. Checked by name,
          # target, active enforcement, and the immutability rules themselves.
          for pair in "main-hardening:branch" "release-tags-immutable:tag"; do
            name="${pair%%:*}"; target="${pair##*:}"
            id=$(echo "$rulesets" | jq -r --arg n "$name" --arg t "$target" \
              'map(select(.name==$n and .target==$t and .enforcement=="active")) | .[0].id // empty')
            if [ -z "$id" ]; then
              echo "drift: no active ${target} ruleset '${name}'"; fail=1; continue
            fi
            has=$(gh api "repos/${repo}/rulesets/${id}" \
              --jq '[.rules[].type] | contains(["non_fast_forward","deletion"])')
            if [ "$has" != "true" ]; then
              echo "drift: ruleset '${name}' lacks non_fast_forward+deletion"; fail=1
            else
              echo "ruleset '${name}' active and enforcing immutability"
            fi
          done
          [ "$fail" = 0 ] && echo "protection rulesets present and enforcing"
          exit "$fail"
