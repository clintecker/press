name: Ledger review

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    concurrency:
      group: ${{ github.workflow }}-ledger-review
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the press from the hash-locked dependencies
        run: |
          pip install --require-hashes -r requirements-lock.txt
          pip install --no-deps -e .
      - name: Open or update the expiring-entries issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ledger_review_watch.py --open-issue
