invariants:
  INV-archive-site-bytes:
    ci_tier: quality
    criticality: standard
    enforced_by: verify_archives:verify_site_zip
    layers:
    - selftest
    owner: verify_archives
    risk: The downloadable reader disagrees with the site that was verified.
    statement: The reader zip is byte-for-byte the verified site directory.
    negative_proof: 
      tests/test_properties_policy.py::test_secret_named_file_is_never_admitted
    limitations:
    - Compares to the on-disk site, which must itself have been verified first.
  INV-archive-source-policy:
    ci_tier: quality
    critical: true
    criticality: critical
    enforced_by: package_source:publication_members
    layers:
    - selftest
    - pytest
    negative_proof: 
      tests/test_properties_policy.py::test_secret_named_file_is_never_admitted
    owner: package_source
    risk: A public source archive leaks a secret or a file outside the repo.
    statement: 'The source zip holds exactly what the publication policy admits: tracked
      files only, symlinks never dereferenced, secret files abort, no member escapes
      its prefix.'
    limitations:
    - Secret and junk patterns are fixed lists; a novel secret filename is not 
      caught.
  INV-authorities-claims:
    ci_tier: quality
    criticality: standard
    enforced_by: gen_authorities:generate
    layers:
    - selftest
    - pytest
    owner: gen_authorities
    risk: A citation outlives the sentence it attributed, rotting silently.
    statement: Every authorities claim appears in the manuscript exactly once in
      its declared file; malformed, duplicate, missing, moved, and ambiguous 
      entries are each named.
    negative_proof: 
      tests/test_selftest_checks.py::test_invariant_check_passes[check_authorities_ledger]
    limitations:
    - Whitespace-normalized substring match; a coincidental duplicate counts as 
      a hit.
  INV-authorities-printsafe:
    ci_tier: quality
    criticality: standard
    enforced_by: gen_authorities:print_safe
    layers:
    - selftest
    owner: gen_authorities
    risk: A citation carrying a backslash reaches the TeX engine as a command.
    statement: Researched source text is print-safe and TeX-safe.
    negative_proof: src/press/selftest.py::check_honest_refusals
    limitations:
    - Fixed replacement table.
  INV-cli-exit-code:
    ci_tier: quality
    criticality: standard
    enforced_by: __main__:console
    layers:
    - selftest
    - pytest
    owner: __main__
    risk: A pandoc or TeX failure ends in a Python traceback, not the tool's 
      message.
    statement: A failing tool's exit code passes through the console, never a 
      traceback.
    negative_proof: src/press/selftest.py::check_honest_refusals
    limitations:
    - Only CalledProcessError is unwrapped.
  INV-commerce-config:
    ci_tier: quality
    criticality: standard
    enforced_by: commerce:validate
    layers:
    - selftest
    - pytest
    owner: commerce
    risk: A book site advertises ordering with an insecure or broken link, leaks
      a credential into a public page, or hides who the seller is.
    statement: The print-order CTA is generated only for an enabled, valid 
      config; verification refuses a non-HTTPS storefront or policy link, an 
      unnamed seller of record, an embedded secret, or an unknown key. A policy 
      link the publisher omits is generated as an honest page on the site that 
      discloses the seller of record; the rendered landing page carries the CTA 
      exactly when ordering is enabled, every generated policy page exists, and 
      no page leaks a secret.
    negative_proof: tests/test_commerce.py::test_an_embedded_secret_is_refused
    limitations:
    - Validates the config's shape and safety and the rendered page's shape; it 
      cannot confirm the storefront URL is reachable or that the linked product 
      is the qualified edition (the release gate and physical qualification do 
      that).
  INV-commerce-release-gate:
    ci_tier: quality
    criticality: standard
    enforced_by: commerce:release_problems
    layers:
    - selftest
    - pytest
    owner: commerce
    risk: A book publishes an "order a print copy" link for an edition no one 
      has verified a provider can actually print.
    statement: A book that advertises print ordering may not ship a release 
      unless its config is valid and its exact edition passed a physical 
      qualification; a missing, invalid, or unqualified edition fails the 
      release gate closed, while a book that sells nothing ships freely.
    negative_proof: 
      tests/test_commerce.py::test_release_gate_refuses_an_unqualified_edition
    limitations:
    - The pure gate decides on the config and whether the edition is qualified; 
      the orchestrator that builds the edition identity from the print pack and 
      matches inspections against it is proven by the pytest component test, and
      enforcement is release-gated (PRESS_RELEASE), advisory otherwise.
  INV-config-locatable:
    ci_tier: quality
    criticality: standard
    enforced_by: booklib:load_config_mapping
    layers:
    - selftest
    owner: booklib
    risk: An author faces a parser traceback instead of a fixable diagnostic.
    statement: Config defects are collected and reported with file and key; YAML
      errors are located; a non-mapping config file is refused.
    negative_proof:
    - src/press/selftest.py::check_honest_refusals
    - src/press/selftest.py::check_book_model
    limitations:
    - Some YAML errors carry no line mark.
  INV-config-registrations:
    ci_tier: quality
    criticality: standard
    enforced_by: barcode:validate
    layers:
    - selftest
    - pytest
    owner: registrations
    risk: A malformed identifier reaches a retail channel or the barcode.
    statement: ISBN and ISSN check digits are computed, never trusted; retail 
      mode fails on a pending number.
    negative_proof: src/press/selftest.py::check_arithmetic
    limitations:
    - LCCN is shape-checked only; the ISBN is not matched to the barcode 
      edition.
  INV-config-release-witness:
    ci_tier: integration
    criticality: standard
    enforced_by: booklib:require_release_witnesses
    layers:
    - integration
    owner: booklib
    risk: A release is cut that no rendered artifact can be proven to be.
    statement: Release builds refuse vacuous witnesses (fewer than two 
      sentinels, page floor under twenty-four) when PRESS_RELEASE is set.
    negative_proof: 
      tests/test_sabotage.py::test_sabotage_removed_graph_edge_reddens_state_model
    limitations:
    - Counts only; two trivial sentinels satisfy it; drafts skip it.
  INV-config-slug:
    ci_tier: quality
    critical: true
    criticality: critical
    enforced_by: booklib:validate_slug
    layers:
    - selftest
    - pytest
    negative_proof: 
      tests/test_selftest_checks.py::test_slug_invariant_rejects_bad
    owner: booklib
    risk: A crafted slug escapes the dist directory or breaks a filename.
    statement: A slug is strict lowercase kebab, safe as an artifact basename.
    limitations:
    - Fullmatch of a fixed pattern; no other basename hazard is modeled.
  INV-config-trim:
    ci_tier: quality
    criticality: standard
    enforced_by: bookmodel:load
    layers:
    - selftest
    owner: bookmodel
    risk: A book ships at a size the interior geometry was never laid out for.
    statement: Trim comes from the selected design profile, never a hand-entered
      number; a metadata trim that disagrees with the profile is refused.
    negative_proof: src/press/selftest.py::check_book_model
    limitations:
    - The house profile is 6 by 9, so a book selecting no profile keeps the v1 
      trim; non-house profiles owe visual qualification.
  INV-contract-mirror:
    ci_tier: quality
    criticality: standard
    enforced_by: selftest_release:check_contract_mirror
    layers:
    - selftest
    owner: selftest
    risk: The two contributor contracts drift apart and disagree.
    statement: AGENTS.md is a byte-for-byte mirror of CLAUDE.md below the 
      heading.
    negative_proof: 
      tests/test_selftest_checks.py::test_contract_mirror_names_drift_between_agent_instructions
    limitations:
    - Only the body below the first line is compared.
  INV-coverwrap-barcode:
    ci_tier: quality
    criticality: standard
    enforced_by: verify_coverwrap:scanline
    layers:
    - selftest
    - pytest
    owner: verify_coverwrap
    risk: An unscannable or ink-fouled barcode ships on the retail cover.
    statement: The barcode panel has its white card, enough bar transitions, and
      clean quiet zones.
    negative_proof: src/press/selftest.py::check_coverwrap_detectors
    limitations:
    - Twenty-five transitions against EAN-13's real fifty-nine; it proves a 
      symbol, not the right symbol.
  INV-coverwrap-geometry:
    ci_tier: integration
    criticality: standard
    enforced_by: verify_coverwrap:main
    layers:
    - integration
    owner: gen_coverwrap
    risk: A wrong-sized retail cover is produced and blessed.
    statement: The wrap is one page at exactly trim plus bleed plus spine, the 
      spine recomputed from the built interior, never restated.
    negative_proof: 
      tests/test_sabotage.py::test_sabotage_removed_graph_edge_reddens_state_model
    limitations:
    - Spine trusts the declared paper stock; a wrong stock yields a 
      self-consistent wrong spine.
  INV-design-layout-stable:
    ci_tier: integration
    criticality: standard
    enforced_by: build:build_target
    layers:
    - integration
    owner: build
    risk: The house design drifts silently -- a margin shifts, a font is 
      swapped, a plate is displaced -- changing a valid book's typography or 
      layout without the major-version decision the contract requires.
    statement: A valid v1 book renders at the committed house geometry -- page 
      count, embedded fonts, and per-page trim and ink bounds within tolerance 
      -- so the house typography and layout cannot change within a major without
      a deliberate, reasoned baseline decision.
    negative_proof: 
      tests/test_sabotage.py::test_sabotage_removed_graph_edge_reddens_state_model
    limitations:
    - "Toolchain-gated: the rendered comparison runs only where pandoc, LuaLaTeX,
      and the poppler tools are present, and the reviewed baseline is regenerated
      in the pinned toolchain, never silently. The comparison's bite (a font swap,
      a margin shift, a page-count change are each drift) is proven against the committed
      baseline without the toolchain. Two chapters and pages one and two are sampled;
      geometry is toolchain-stable only to the declared tolerance, so a sub-tolerance
      shift is not caught."
  INV-docs-no-drift:
    ci_tier: quality
    criticality: standard
    enforced_by: selftest_release:check_docs
    layers:
    - selftest
    owner: selftest
    risk: The documentation quietly diverges from what the code does.
    statement: Usage and README name every target, REFERENCE.md and 
      INVARIANTS.md equal their generated text, and the aesthetics skill 
      documents every consumed key.
    negative_proof:
    - tests/test_selftest_checks.py::test_docs_check_names_a_drifted_provider_qualification_page
    - src/press/selftest.py::check_aesthetic_schema
    limitations:
    - Presence tests, not semantic ones.
  INV-dropcap-opening:
    ci_tier: quality
    criticality: standard
    enforced_by: dropcaps:split_initial
    layers:
    - unit
    - property
    - integration
    owner: dropcaps
    risk: A drop cap lands on the wrong block (an epigraph, a second paragraph),
      leaks LaTeX or CSS into the manuscript, or a book that never asked for the
      feature has its output altered.
    statement: "When a design enables a chapter-opening drop cap, the initial is placed
      on the first eligible prose paragraph after each chapter heading and nowhere
      else: an epigraph or other non-prose opener is skipped to the real opening paragraph,
      only the first paragraph is capped, and the manuscript carries no renderer markup.
      Any leading punctuation a chapter opening on dialogue carries -- an opening
      quote or a dash -- is set beside the initial at its size (through lettrine's
      ante, or its own floated span on the web), never scaled up into the initial
      and stranded above it. When the style is off, the filter changes nothing, so
      a book that does not opt in renders unchanged; and a book whose chapters open
      on ordinary words compiles to the same lettrine call whatever style it uses."
    negative_proof: 
      tests/test_sabotage.py::test_sabotage_removed_graph_edge_reddens_state_model
    limitations:
    - The eligibility and emission are proven by running the Lua filter through 
      pandoc; the rendered PDF (which needs the lettrine package from the 
      toolchain image) is proven where that toolchain is present. The grapheme 
      and punctuation split is proven exhaustively in test_dropcaps.
  INV-edition-manifest:
    ci_tier: quality
    critical: true
    criticality: critical
    enforced_by: edition:verify_facts
    layers:
    - selftest
    - pytest
    negative_proof: tests/test_edition.py::test_forged_identity_is_refused
    owner: edition
    risk: An order ships bytes that differ from the release-approved edition, or
      a manifest leaks a price, secret, or customer datum.
    statement: 'An edition manifest is immutable identity: any production-affecting
      fact mints a new edition_id, and verification refuses a forged identity, an
      interior or cover byte or page mismatch, an ill-formed or mutable reference,
      a forbidden price/secret/customer field, a manifest with no receipt chain or
      built from a dirty tree, and a provider qualification proven against a different
      edition.'
    limitations:
    - Verifies content identity against the artifacts on disk and the 
      well-formedness of qualification evidence; it does not re-run a provider's
      physical qualification, only reject a qualification whose named edition is
      not this one.
  INV-editorial-banned-regex:
    ci_tier: quality
    criticality: standard
    enforced_by: style_audit:banned_book_patterns
    layers:
    - selftest
    owner: style_audit
    risk: An author's regex slip becomes a parser traceback mid-audit.
    statement: A malformed book-supplied banned regex is refused by name.
    negative_proof: src/press/selftest.py::check_honest_refusals
    limitations:
    - Only regex-compile errors are caught.
  INV-editorial-battery:
    ci_tier: quality
    criticality: standard
    enforced_by: style_audit:main
    layers:
    - selftest
    - integration
    owner: style_audit
    risk: Synthetic or print-unsafe prose reaches a published book.
    statement: The universal prose battery refuses dashes, curly quotes, 
      out-of-font glyphs, throat-clearing, bad headings, and long paragraphs.
    negative_proof:
    - src/press/data/known-bad/em-dash.md
    - src/press/data/known-bad/en-dash.md
    - src/press/data/known-bad/curly-quotes.md
    - src/press/data/known-bad/emoji.md
    - src/press/data/known-bad/title-case.md
    - src/press/data/known-bad/numbered-heading.md
    - src/press/data/known-bad/long-paragraph.md
    - src/press/data/known-bad/trailing-whitespace.md
    - src/press/data/known-bad/in-conclusion.md
    - src/press/data/known-bad/throat-clearing-important.md
    - src/press/data/known-bad/throat-clearing-worth.md
    - src/press/data/known-bad/at-its-core.md
    - src/press/data/known-bad/real-question.md
    - src/press/data/known-bad/lets-dive.md
    - src/press/data/known-bad/without-further-ado.md
    - src/press/data/known-bad/testament.md
    - src/press/data/known-bad/vibrant-tapestry.md
    - src/press/data/known-bad/negative-parallelism.md
    limitations:
    - The glyph law flags legitimate Greek or math; short title-case headings 
      slip.
  INV-editorial-checkers:
    ci_tier: quality
    critical: true
    criticality: critical
    enforced_by: check_the_checkers:main
    layers:
    - selftest
    - integration
    negative_proof:
    - src/press/data/known-bad/em-dash.md
    - tests/test_sabotage.py::test_sabotage_removed_graph_edge_reddens_state_model
    owner: check_the_checkers
    risk: A checker silently stops catching what it was built to catch.
    statement: Every known-bad fixture trips its declared rule; known-good 
      passes clean.
    limitations:
    - A book fixture with no expect comment falls back to any-rejection.
  INV-editorial-jargon:
    ci_tier: quality
    criticality: standard
    enforced_by: jargon_lint:main
    layers:
    - selftest
    owner: jargon_lint
    risk: Overused jargon the author outlawed survives into the book.
    statement: Watchlist terms at rewrite severity fail the run.
    negative_proof: src/press/data/known-bad/jargon.md
    limitations:
    - Exact matches only; a per-book allow list can silence any term.
  INV-editorial-jargon-parity:
    ci_tier: quality
    criticality: standard
    enforced_by: selftest_book:check_jargon_parity
    layers:
    - selftest
    - pytest
    owner: jargon_lint
    risk: A matching, normalization, or allowlist fix lands in one checker and 
      authors running the standalone skill get different accept/reject results 
      than press check.
    statement: The package jargon checker and the portable skill copy return 
      equivalent findings and refusals for the same text and watchlist, and 
      default to the same watchlist.
    negative_proof: 
      tests/test_jargon_parity.py::test_shared_logic_is_byte_identical
    limitations:
    - A shared-source and fixture/property contract, not a single shared engine;
      the watchlist data is shared by construction.
  INV-extension-conformance:
    ci_tier: quality
    critical: true
    criticality: critical
    enforced_by: extensions:conformance
    layers:
    - selftest
    - pytest
    negative_proof: src/press/data/extensions/hostile/collision.yaml
    owner: extensions
    risk: A third-party extension shadows a core artifact or command, or a 
      manifest written for a future contract loads and behaves unpredictably, 
      because collisions and version mismatches were discovered at build time 
      instead of refused up front.
    statement: An extension declaration is refused before execution when it 
      collides with a core name, targets an extension-contract major this press 
      does not implement, is structurally malformed, or names an unknown 
      dependency. Discovery is declarative and deterministic; nothing runs on 
      the strength of import order or an ambient entry point.
    limitations:
    - Conformance decides on the declared manifest -- the names, contract major,
      dependencies, invariants, and capabilities an extension states; it does 
      not sandbox arbitrary code, because the contract admits no code extension,
      only declarative registry entries.
  INV-extension-seal:
    ci_tier: quality
    critical: true
    criticality: critical
    enforced_by: extensions:conformance
    layers:
    - selftest
    - pytest
    negative_proof: src/press/data/extensions/hostile/collision.yaml
    owner: extensions
    risk: A plugin silently weakens or stands in for core verification, or ships
      a guarantee nothing enforces, so a book carries an invariant that is never
      checked.
    statement: An extension may depend on the mandatory verification, path 
      containment, artifact graph, config validation, and release gate, but it 
      may never declare that it provides or replaces one, and it may not carry 
      an invariant it does not prove. A manifest that claims a sealed capability
      or an unproven obligation is refused.
    limitations:
    - The seal is a fixed set of capability tokens and the rule that every 
      declared invariant names a proof; it governs what a manifest may claim, 
      not the runtime behavior of a code extension, which the contract does not 
      admit.
  INV-format-agreement:
    ci_tier: quality
    criticality: standard
    enforced_by: verify_formats:verify_editions_agree
    layers:
    - selftest
    - pytest
    - integration
    owner: verify_formats
    risk: A single format loses a chapter -- a broken pandoc filter, a truncated
      export -- and ships, because each edition was only ever checked for one 
      witness line and the formats were never cross-checked against each other.
    statement: Every chapter's content appears in every built edition; an 
      edition that silently drops a chapter (or most of it) disagrees with the 
      editions that kept it and is refused, not passed.
    negative_proof: 
      tests/test_verify_editions.py::test_an_edition_that_drops_a_chapter_is_named_and_refused
    limitations:
    - "Presence of a distinctive multi-word fragment per chapter, not a full diff:
      an edition that keeps each chapter's witness fragment but scrambles or truncates
      the surrounding prose is not caught. The PDF joins the agreement set only where
      pdftotext is present (the toolchain tier); the other editions are checked with
      no external tool."
  INV-format-site-identity:
    ci_tier: quality
    criticality: standard
    enforced_by: verify_formats:verify_site
    layers:
    - selftest
    owner: verify_formats
    risk: A duplicated or missing chapter page passes on file count alone.
    statement: Each chapter's witness appears exactly once across the reader 
      site.
    negative_proof: 
      tests/test_selftest_checks.py::test_invariant_check_passes[check_site_identity]
    limitations:
    - A chapter with no qualifying line contributes no witness.
  INV-format-structure:
    ci_tier: integration
    criticality: standard
    enforced_by: build:build_target
    layers:
    - integration
    - unit
    owner: build
    risk: An edition silently loses its structure -- a chapter document dropped 
      from the EPUB spine, a nav entry gone, a house DOCX style removed -- and 
      ships, because only the PDF's shape was ever pinned.
    statement: "A valid v1 book's non-PDF editions keep their committed structural
      shape: the EPUB's chapter-document count exactly, its spine and nav and the
      reader site's pages and links no smaller than the reviewed baseline, and the
      DOCX still declaring every house style."
    negative_proof: 
      tests/test_sabotage.py::test_sabotage_removed_graph_edge_reddens_state_model
    limitations:
    - 'Toolchain-gated: the rendered comparison runs only where pandoc is present,
      and the reviewed baseline is regenerated deliberately, never silently. Book-determined
      counts are matched exactly; version-sensitive shapes are matched in the regression
      direction only, so a benign pandoc upgrade that adds a spine item or a token
      style is not caught, by design.'
  INV-format-witness:
    ci_tier: quality
    critical: true
    criticality: critical
    enforced_by: verify_formats:require_witnesses
    layers:
    - selftest
    - pytest
    negative_proof: 
      tests/test_selftest_checks.py::test_invariant_check_passes[check_format_witnesses]
    owner: verify_formats
    risk: A format silently drops the manuscript and still verifies.
    statement: Title and a derived manuscript witness appear in every format; a 
      book yielding no witness is refused, not passed.
    limitations:
    - One longest line per document; a format dropping every other line is not 
      caught here -- INV-format-agreement holds the full per-chapter witness set
      against every edition to close that gap.
  INV-graph-acyclic:
    ci_tier: quality
    criticality: standard
    enforced_by: registry:build_order
    layers:
    - selftest
    - pytest
    owner: registry
    risk: A build order cycles or an artifact has no real output.
    statement: The artifact graph is acyclic, outputs unique, every published 
      artifact a concrete filename.
    negative_proof: 
      tests/test_sabotage.py::test_sabotage_removed_graph_edge_reddens_state_model
    limitations:
    - Proves graph shape, not that each builder produces its declared output.
  INV-graph-escaping:
    ci_tier: quality
    criticality: standard
    enforced_by: build:cover_fragment_html
    layers:
    - selftest
    - property
    owner: build
    risk: A title with markup corrupts the single-file HTML or injects TeX.
    statement: Metadata interpolated into HTML and TeX is escaped.
    negative_proof: src/press/selftest.py::check_honest_refusals
    limitations:
    - The HTML cover fragment and the front-matter TeX escaper 
      (gen_front_matter.escape) are proven; other sibling sites share the 
      pattern unproven.
  INV-graph-no-stale:
    ci_tier: integration
    critical: true
    criticality: critical
    enforced_by: __main__:main
    layers:
    - integration
    negative_proof: 
      tests/test_sabotage.py::test_sabotage_removed_graph_edge_reddens_state_model
    owner: __main__
    risk: A verifier passes an old artifact that no longer matches the source.
    statement: Verify targets rebuild before verifying; a stale artifact cannot 
      be blessed.
    limitations:
    - CLI-path only; importing a verifier module directly skips the rebuild.
  INV-migration-preview:
    ci_tier: quality
    criticality: standard
    enforced_by: migrate:plan
    layers:
    - selftest
    - pytest
    owner: migrate
    risk: An author applies a major upgrade blind and discovers the design or 
      pin changes only after the fact.
    statement: A migration dry run reports every change it would make and every 
      design consequence to weigh, and writes nothing; a book learns exactly 
      what moving majors does before a byte changes.
    negative_proof: tests/test_migrate.py::test_apply_then_rollback_is_exact
    limitations:
    - The preview enumerates the pin changes and the house-profile design 
      verdict; a book that has already selected a non-house profile carries that
      design choice independently of the migration.
  INV-migration-safe:
    ci_tier: quality
    critical: true
    criticality: critical
    enforced_by: migrate:apply
    layers:
    - selftest
    - pytest
    negative_proof: tests/test_migrate.py::test_apply_then_rollback_is_exact
    owner: migrate
    risk: An upgrade silently rewrites prose or art, or leaves a book stranded 
      on a half-changed pin with no way back.
    statement: Migrating a book between press majors moves only the pin, in 
      requirements.txt and the CI workflow; the manuscript, config, and accepted
      art come out byte-for-byte identical, and rollback restores the exact 
      pre-migration pin from a backup written before any file is changed.
    limitations:
    - Proven on a scaffolded book (the two pin sites the template writes); a 
      book that pins the press somewhere exotic is diagnosed and refused rather 
      than rewritten, not migrated.
  INV-pages-refs:
    ci_tier: quality
    criticality: standard
    enforced_by: verify_pages:check_refs
    layers:
    - selftest
    - pytest
    owner: verify_pages
    risk: The public site ships dead links or a stylesheet pointing at nothing.
    statement: Every local reference and stylesheet url resolves; fragments 
      resolve to real anchors.
    negative_proof: src/press/selftest.py::check_pages_verifier
    limitations:
    - External links are skipped; a dead external URL is never caught.
  INV-pdf-detector:
    ci_tier: quality
    critical: true
    criticality: critical
    enforced_by: verify_pdf:self_test_detector
    layers:
    - selftest
    - pytest
    negative_proof: src/press/selftest.py::check_coverwrap_detectors
    owner: verify_pdf
    risk: A miscalibrated detector passes blank pages or fails inked ones.
    statement: The blank-page detector is proven against fixtures before it 
      judges.
    limitations:
    - Two synthetic extremes; a faint hairline can still read as blank.
  INV-pdf-ink:
    ci_tier: integration
    criticality: standard
    enforced_by: verify_pdf:verify_page_ink
    layers:
    - integration
    owner: verify_pdf
    risk: A blank or clipped page ships in the interior.
    statement: Every rendered page carries ink and keeps it off the edge.
    negative_proof: 
      tests/test_sabotage.py::test_sabotage_removed_graph_edge_reddens_state_model
    limitations:
    - Tolerates one structural blank verso in the print profile.
  INV-profile-geometry:
    ci_tier: quality
    criticality: standard
    enforced_by: profiles:geometry_tex
    layers:
    - pytest
    owner: profiles
    risk: A profile silently renders at the wrong trim, or a sealed design value
      drifts while its visual baseline still reads as valid.
    statement: Selecting a design profile renders the interior at that profile's
      declared trim, and an unknown profile is refused before any rendering. A 
      profile's design-affecting data has a stable digest, so a sealed value 
      cannot change without the key that scopes its visual baseline moving too.
    negative_proof: 
      tests/test_sabotage.py::test_sabotage_removed_graph_edge_reddens_state_model
    limitations:
    - The rendered-trim proof runs where the toolchain is present (the 
      integration tier); locally, the projection-string and digest proofs stand 
      in. Typography and web tokens are projected and proven at the fragment 
      level; their rendered baselines are generated in the pinned toolchain.
  INV-provider-contract:
    ci_tier: quality
    critical: true
    criticality: critical
    enforced_by: selftest_release:check_provider_contract
    layers:
    - selftest
    - pytest
    negative_proof: 
      tests/test_provider_conformance.py::test_an_unsupported_capability_is_declared_not_simulated
    owner: providers
    risk: A provider coupling leaks SDK types into the domain, a lost response 
      prints a second copy, an unknown status is guessed, or a forged webhook is
      trusted.
    statement: 'Every print-provider adapter maps its own vocabulary to the neutral
      contract: money is integer minor units parsed without binary float, an unrecognized
      status quarantines to UNKNOWN, a submission timeout is an unknown outcome that
      forces a lookup before any resubmission (never a hidden retry or a fabricated
      acceptance), an unsupported capability is a typed refusal rather than a simulation,
      and a webhook is authentic only when its signature matches the raw body.'
    limitations:
    - The contract and the conformance suite are proven against the smart fake 
      and the Lulu adapter under a canned transport; the live Lulu sandbox 
      exchange awaits credentials (the deferred end-to-end proof).
  INV-provider-qualification:
    ci_tier: quality
    criticality: standard
    enforced_by: qualification:qualify
    layers:
    - selftest
    - pytest
    owner: qualification
    risk: A book is sold as printable by a provider that cannot produce the 
      exact object, or a qualification survives a production-affecting change to
      the edition.
    statement: The provider record declares every capability explicitly (an 
      omitted capability is a forbidden implicit claim) and the full physical 
      checklist; a provider is qualified for an edition only by a physical 
      inspection with every checklist point passed, scoped to that edition's 
      identity, so a marketing claim, a failed point, a not-fit provider, and an
      inspection of a different edition are all refused.
    negative_proof: 
      tests/test_qualification.py::test_a_failed_point_cannot_qualify
    limitations:
    - Validates the record's shape and the physical-gate logic; it cannot 
      confirm a claimed inspection actually happened, only that a qualification 
      carries a passed, edition-scoped inspection digest.
  INV-release-contract:
    ci_tier: integration
    criticality: standard
    enforced_by: selftest_release:check_release_grammar
    layers:
    - integration
    owner: selftest
    risk: A pinned book resolves a different pipeline than the tag promises.
    statement: A three-part tag pins its own action ref and an existing 
      immutable toolchain image, proven before the major floats.
    negative_proof: 
      tests/test_sabotage.py::test_sabotage_removed_graph_edge_reddens_state_model
    limitations:
    - The pin grep is an exact string; it does not prove the tag's tree.
  INV-release-receipt-chain:
    ci_tier: integration
    critical: true
    criticality: critical
    enforced_by: receipts:verify_release
    layers:
    - selftest
    - pytest
    - integration
    negative_proof: 
      tests/test_receipts.py::test_release_refuses_dirty_tree_receipt
    owner: receipts
    risk: A release ships objects that differ from the ones the tests proved.
    statement: A release chain refuses a missing, tampered, reordered, or 
      input-mismatched prerequisite, a dirty-tree receipt, a terminal receipt 
      whose package or toolchain does not match the built and pinned objects, an
      incomplete chain that skips any trust layer or breaks a layer's extension 
      of its predecessor, and, when assembled from per-job receipts, a missing 
      CI tier (a job that did not run leaves no receipt) or receipts that 
      disagree on the source commit.
    limitations:
    - The per-job assembly makes the chain reflect the CI jobs that actually ran
      and uploaded a receipt; it trusts that an uploaded tier receipt attests 
      real work, and the cross-workflow artifact download is proven only by a 
      live release, not the fast suite.
  INV-release-tag-grammar:
    ci_tier: quality
    critical: true
    criticality: critical
    enforced_by: selftest_release:check_release_grammar
    layers:
    - selftest
    - pytest
    negative_proof: scripts/release.sh
    owner: selftest
    risk: A malformed tag or an injected command reaches the release path.
    statement: A release tag is strict SemVer and the composite action refuses 
      shell syntax in its command input.
    limitations:
    - The action grammar is proven by unit test, not by a live workflow run.
  INV-scaffold-neutral:
    ci_tier: quality
    criticality: standard
    enforced_by: selftest_book:check_scaffold_neutrality
    layers:
    - selftest
    - pytest
    - integration
    owner: scaffold
    risk: A new book inherits another book's name, person, or imprint.
    statement: No original-book identity leaks into a clean scaffold.
    negative_proof: src/press/data/template/config/metadata.yaml
    limitations:
    - Pattern-based; a novel identifying string is not caught.
version: 1
