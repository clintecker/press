source = "src/press"
exclude = ["src/press/data/**", "src/press/surfaces.py"]
policy_roles = ["verifier", "parser", "producer", "adapter", "orchestrator"]

# press's own domain checks (the book/publishing verifiers celebrimbor cannot
# know about). The CLI imports this module so `celebrimbor gate` runs all 28
# press.* checks alongside the builtins -- no hand-rolled wrapper. A module that
# will not import is a hard, fail-closed error (celebrimbor 0.7.0, #7).
check_modules = ["press.quality_checks"]

[paths]
surfaces = ".celebrimbor/surfaces.yaml"
invariants = ".celebrimbor/invariants.yaml"
producers = ".celebrimbor/producers.yaml"
coverage_baseline = ".celebrimbor/baselines/coverage.yaml"
mutation_baseline = ".celebrimbor/baselines/mutation.yaml"
