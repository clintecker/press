# Every checked-in file format has its linter, and the same gates run
# before the commit exists and in CI (the quality job runs
# `pre-commit run --all-files`). Install once:
#   pip install -e '.[dev]' && pre-commit install
#
# This is the FAST (static) commit tier only: linters and the type
# check, seconds not minutes. The heavy test tiers -- `press selftest`
# (invariants + doc drift) and the full pytest suite (~4.5 min, wheel
# build included) -- are deliberately NOT commit hooks; they run in CI's
# `selftest` matrix job (`press selftest` + `python -m pytest` across
# every supported interpreter) and again on the installed wheel. A
# commit gate that costs 4.5 minutes is the anti-pattern the celebrimbor
# tiering exists to kill: prove statically at commit, prove behaviorally
# in CI. Run the full suite locally before pushing with `python -m
# pytest` (or `scripts/verify.sh`) when you want the belt-and-braces.
#
# JS (data/workflows/*.js) and CSS have no pip-installable linter;
# their gates are the workflow runtime's own parser and the site
# link-checker respectively, until a Node toolchain is deliberately
# adopted.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=600"]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        # the scaffold template carries {{PLACEHOLDER}} lines (a template,
        # not YAML, until press new renders it), and the fuzz corpus is
        # deliberately-broken YAML that must never be linted clean.
        exclude: "src/press/data/template/|tests/fuzz/corpus/"
  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.25
    hooks:
      - id: pymarkdown
        args: ["--config", ".pymarkdown.json", "scan"]
        # known-bad fixtures and the jargon parity corpus inputs are
        # deliberately defective (bare URLs, language-less fences, the
        # constructs the checkers must strip); linting them to
        # cleanliness would defeat their purpose.
        exclude: "(known-bad/|tests/corpus/jargon_parity/inputs/)"
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.5.2
    hooks:
      # Formats the pandoc Lua filters against stylua.toml. stylua-github
      # fetches the single static binary, so CI needs no Lua toolchain.
      - id: stylua-github
        files: ^src/press/data/lua/.*\.lua$
  - repo: local
    hooks:
      - id: roadmap
        name: roadmap registry projection
        entry: python3 scripts/sync_roadmap.py --check
        language: system
        pass_filenames: false
      - id: ruff
        name: ruff (lint + complexity gate)
        entry: ruff check src/press scripts tests
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: python3 -m mypy src/press
        language: system
        pass_filenames: false
      - id: lua-syntax
        name: lua filters compile (pandoc lua)
        entry: scripts/lua-syntax-gate.sh
        language: script
        files: ^src/press/data/lua/.*\.lua$
        pass_filenames: false
